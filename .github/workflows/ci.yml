name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Linux scripts and Python
        run: |
          bash -n linux/install.sh linux/uninstall.sh linux/diagnose.sh
          bash -n linux/remote-mic/pin-linux-safe.sh
          python3 -m py_compile linux/remote_hid_filter.py
          bash -n macos/install.sh

      - name: Install original Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-evdev python3-pytest

      - name: Linux presenter regression
        run: |
          cd linux
          python3 -m pytest -q tests

      - name: Cross-platform mapping contract and browser video
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          node browser/tests/video-ok.test.cjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell installers
        shell: powershell
        run: |
          foreach ($file in @("windows/install.ps1", "windows/uninstall.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$null, [ref]$errors
            ) > $null
            if ($errors.Count) {
              $errors | Out-String | Write-Error
              exit 1
            }
          }

      - name: Validate AutoHotkey device and browser contract
        shell: powershell
        run: |
          $safe = Get-Content windows/xiaomi_remote_safe.ahk -Raw
          $safeNeed = @(
            '#Requires AutoHotkey v2.0',
            'GetKeyboardId(VID, PID, 1)',
            'CreateContextManager(KeyboardId)',
            '#HotIf RemoteContext.IsActive && IsBrowser()',
            'Home::SendOnce("Home", "^t")',
            'SC029::SendOnce("SC029", "^w")',
            'AppsKey::SendOnce("AppsKey", "^{Tab}")',
            '#HotIf RemoteContext.IsActive && IsVideoPage()',
            'Enter::SendOnce("Enter", "{F13}")',
            'Up::SendOnce("Up", "d")',
            'Down::SendOnce("Down", "a")'
          )
          foreach ($item in $safeNeed) {
            if (-not $safe.Contains($item)) {
              Write-Error "Missing SAFE Windows mapping: $item"
              exit 1
            }
          }
          if ($safe.Contains('IsPresentationEditor()') -or
              $safe.Contains('Browser_Back::') -or
              $safe.Contains('Enter::SendOnce("Enter", "{F5}")')) {
            Write-Error "SAFE Windows script unexpectedly intercepts legacy presentation or Back"
            exit 1
          }
          $installer = Get-Content windows/install.ps1 -Raw
          if (-not $installer.Contains('xiaomi_remote_safe.ahk') -or
              -not $installer.Contains('[switch]$FullMode')) {
            Write-Error "Windows installer must default to SAFE and retain explicit FullMode"
            exit 1
          }
          $s = Get-Content windows/xiaomi_remote_presenter.ahk -Raw
          $need = @(
            '#Requires AutoHotkey v2.0',
            'GetKeyboardId(VID, PID, 1)',
            'CreateContextManager(KeyboardId)',
            'IsPresentationEditor()',
            'IsBrowser()',
            'Home::SendOnce("Home", "^t")',
            'SC029::SendOnce("SC029", "^w")',
            'AppsKey::SendOnce("AppsKey", "^{Tab}")',
            'Browser_Back::SendOnce("Browser_Back", "!{Left}")',
            'Browser_Back::SendOnce("Browser_Back", "{Esc}")',
            'Enter::SendOnce("Enter", "{F5}")',
            'Enter::SendOnce("Enter", "{F13}")',
            'Up::SendOnce("Up", "d")',
            'Down::SendOnce("Down", "a")'
          )
          foreach ($item in $need) {
            if (-not $s.Contains($item)) {
              Write-Error "Missing Windows device mapping: $item"
              exit 1
            }
          }
          if (-not (Test-Path "browser/xiaomi-remote-video.user.js")) { exit 1 }
          Write-Host "Windows AutoHotkey mapping contract passed"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Mac shell and regenerate Karabiner JSON
        run: |
          bash -n macos/install.sh
          python3 macos/build_rules.py
          git diff --exit-code -- macos/xiaomi-remote-presenter.json macos/xiaomi-remote-safe.json macos/xiaomi-remote-video-ok.json macos/xiaomi-remote-video-speed.json
          python3 -m json.tool macos/xiaomi-remote-presenter.json >/dev/null
          python3 -m json.tool macos/xiaomi-remote-safe.json >/dev/null
          python3 -m json.tool macos/xiaomi-remote-video-ok.json >/dev/null
          python3 -m json.tool macos/xiaomi-remote-video-speed.json >/dev/null

      - name: Mac device/app and optional speed contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -q

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious secrets
        run: |
          ! grep -RInE 'sk-[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
