name: RC003 Electron Linux Package
on:
  push:
    tags:
      - "v1.*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python system/app key policy regression
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install -e linux/remote-mic
          PYTHONPATH=linux/remote-mic .ci-venv/bin/python -m unittest discover -s linux/remote-mic/tests -p 'test_key_layers.py' -q
          PYTHONPATH=linux/remote-mic .ci-venv/bin/python -m unittest discover -s linux/remote-mic/tests -p 'test_gatt_key_bridge.py' -q
          PYTHONPATH=linux/remote-mic .ci-venv/bin/python -m unittest discover -s linux/remote-mic/tests -p 'test_chatgpt_navigation_rules.py' -q
      - name: Download official Electron runtime
        run: |
          curl --fail --location --retry 3 --retry-delay 3 --output "$GITHUB_WORKSPACE/electron.zip" "https://github.com/electron/electron/releases/download/v40.10.2/electron-v40.10.2-linux-x64.zip"
          unzip -t "$GITHUB_WORKSPACE/electron.zip" > /dev/null
      - name: Build Debian package and checksums
        run: |
          ELECTRON_ZIP="$GITHUB_WORKSPACE/electron.zip" bash linux/remote-mic/electron/build-deb.sh
          dpkg-deb -f linux/remote-mic/electron/dist/xiaomi-remote-control_*_amd64.deb Package Version Architecture
          sha256sum linux/remote-mic/electron/dist/xiaomi-remote-control_*_amd64.deb > linux/remote-mic/electron/dist/SHA256SUMS
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc003-linux-amd64
          path: |
            linux/remote-mic/electron/dist/*.deb
            linux/remote-mic/electron/dist/SHA256SUMS
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: RC003 Electron Linux Preview
          body: |
            Xiaomi RC003 Electron visual profiles for Ubuntu Linux x64.
            Three layers: protected OS Power/Volume/Brightness, per-app Browser/ChatGPT/WPS, and independent BLE voice. Includes Brooks engineering and Jobs product reports.
            Linux Python/systemd runtime must be installed separately. Volume and WeChat fullscreen still need hardware validation.
            Documentation: docs/RC003-Electron-配置中心.md
          files: |
            linux/remote-mic/electron/dist/*.deb
            linux/remote-mic/electron/dist/SHA256SUMS
