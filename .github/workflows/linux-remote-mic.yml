name: Linux enhanced Global Speed & microphone

on:
  push:
    paths:
      - "linux/remote-mic/**"
      - ".github/workflows/linux-remote-mic.yml"
  pull_request:
    paths:
      - "linux/remote-mic/**"
      - ".github/workflows/linux-remote-mic.yml"

jobs:
  linux-enhanced:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and system bindings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 python3-venv python3-gi python3-evdev gir1.2-atspi-2.0

      - name: Validate startup scripts
        run: |
          bash -n linux/remote-mic/install.sh linux/remote-mic/install-services.sh
          python3 -m py_compile linux/remote-mic/*.py
          python3 -m py_compile linux/remote-mic/src/xiaomi_remote_mic_linux/*.py
          node --check linux/remote-mic/chatgpt-web/xiaomi-video-speed.user.js

      - name: Install test requirements in isolated venv
        run: |
          cd linux/remote-mic
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check -e .

      - name: Run Python regressions and JS PiP routing tests
        run: |
          cd linux/remote-mic
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -q
          node tests/test_video_userscript.cjs
          node tests/test_video_userscript_pip.cjs

      - name: Ensure no private credentials were committed
        run: |
          ! find linux/remote-mic -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' \) | grep .
          ! grep -RInE --exclude-dir=.venv --exclude=LICENSE \
            'sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{25,}|github_pat_[A-Za-z0-9_]{25,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' linux/remote-mic
